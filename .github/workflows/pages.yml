name: Pages

# Publishes the live demo report (ESMO2026-poster/index.html) to GitHub Pages.
# Branch-based Pages can only serve / or /docs, so the site is deployed from
# a workflow instead after docs/ moved to ESMO2026-poster/.

on:
  push:
    branches: [main]
    paths:
      - ESMO2026-poster/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site
        run: |
          mkdir -p _site
          cp ESMO2026-poster/index.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
